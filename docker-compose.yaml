services:
  karretje:
    build: .
    container_name: karretje-dev
    ports:
      - "6969:80"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - API_KEY=${API_KEY:?API_KEY is required: run `API_KEY=your-secret docker compose up --build` or put API_KEY=your-secret in a .env file next to docker-compose.yaml}
